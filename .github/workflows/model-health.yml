name: Model health

# Probes every model alias in litellm_config.yaml through the proxy and flags
# when the upstream provider changes availability (e.g. the 'no choices' failure
# that forced the sonnet -> opus-4.8 remap). Keeps the config honest.

on:
  schedule:
    - cron: "0 13 * * *" # daily 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  model-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Fetch probe script from hub (pinned SHA)
        run: |
          bash scripts/fetch_probe_from_hub.sh --with-parser "$RUNNER_TEMP"

      - name: Probe each configured alias through the proxy
        id: probe
        env:
          BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"
          if [ -z "$base" ] || [ -z "${AUTH_TOKEN:-}" ]; then
            echo "::error::LITELLM_BASE_URL / LITELLM_MASTER_KEY are not set on this repo"
            exit 1
          fi

          # Concrete, probe-safe aliases — delegated to scripts/probe_selector.py
          # (refs #174), the single source of truth for the wildcard '*' and
          # '-fallback' exclusion. openrouter/* and github_copilot/* are not
          # concrete models: probing them returns HTTP 400 and pollutes every
          # model-health report.
          aliases=$(python3 -c "import json, sys, yaml; sys.path.insert(0, 'scripts'); from probe_selector import select_probe_aliases; d=yaml.safe_load(open('litellm_config.yaml')); print('\n'.join(select_probe_aliases(d)))")
          # Fail fast: a parse error or missing PyYAML yields an empty list, which
          # would otherwise sail through below as "all healthy" (a false green).
          if [ -z "$(printf '%s' "$aliases" | tr -d '[:space:]')" ]; then
            echo "::error::No aliases extracted from litellm_config.yaml (parse error or empty model_list)"
            exit 1
          fi
          echo "Aliases under test:"; echo "$aliases" | sed 's/^/  /'

          probe_script="$RUNNER_TEMP/probe_completion.sh"
          if [ ! -f "$probe_script" ]; then
            echo "::error::Probe script missing: $probe_script"
            exit 1
          fi

          # `broken` = hard failures (page). `degraded` = proxy up but empty
          # completion (warning only) — the empty-200 quirk is non-actionable
          # and was the source of the daily false alarms on #148.
          broken=""
          degraded=""
          while IFS= read -r m; do
            [ -n "$m" ] || continue
            if ! probe_out=$(
              GITHUB_OUTPUT= PROBE_BASE_URL="$base" PROBE_AUTH_TOKEN="$AUTH_TOKEN" PROBE_MODEL="$m" \
              PROBE_PROMPT="ping" PROBE_RETRY_INTERVAL=4 bash "$probe_script"
            ); then
              echo "  ❌ $m (probe script crashed)"
              broken="$broken $m"
              continue
            fi
            status=$(printf '%s\n' "$probe_out" | sed -n 's/^status=//p')
            detail=$(printf '%s\n' "$probe_out" | sed -n 's/^detail=//p')
            http_code=$(printf '%s\n' "$probe_out" | sed -n 's/^http_code=//p')
            case "$status" in
              ok)
                echo "  ✅ $m"
                ;;
              degraded)
                echo "  ⚠️ $m (HTTP $http_code, $detail) — empty completion, not paging"
                degraded="$degraded $m"
                ;;
              *)
                echo "  ❌ $m (HTTP $http_code, $detail)"
                broken="$broken $m"
                ;;
            esac
          done <<< "$aliases"

          if [ -n "$broken" ]; then
            { echo "status=fail"; echo "broken=$broken"; } >> "$GITHUB_OUTPUT"
          else
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "All configured aliases are healthy."
          fi
          if [ -n "$degraded" ]; then
            echo "::warning::Degraded (empty completions, not paging):${degraded}"
            echo "degraded=$degraded" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the model-health issue
        if: steps.probe.outputs.status == 'fail'
        uses: ./.github/actions/upsert-issue
        with:
          token: ${{ github.token }}
          label: model-health
          label-color: FBCA04
          label-description: Proxy model availability
          title: "⚠️ Model health: configured alias(es) failing through the proxy"
          body: |
            These `litellm_config.yaml` aliases failed a completion through the proxy at __TIMESTAMP__:

            **Failing (hard):**${{ steps.probe.outputs.broken }}

            ${{ steps.probe.outputs.degraded && format('**Degraded (empty, not paging):**{0}', steps.probe.outputs.degraded) || '' }}

            Usually means the upstream provider changed model availability (the same 'no choices' class that forced the sonnet -> opus-4.8 remap). Update the alias targets in `litellm_config.yaml`.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Mark the job failed
        if: steps.probe.outputs.status == 'fail'
        run: exit 1
