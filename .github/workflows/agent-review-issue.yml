name: "Agent: Review Issue"

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  review-issue:
    if: github.event.label.name == 'agent:review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sandcastle-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
    steps:
      - name: Transition labels
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:review" -R ${{ github.repository }} || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:in-progress" -R ${{ github.repository }}
      - uses: arndvs/ctrlshft-hub/actions/agent-run@main
        with:
          workflow: review-issue
          ref: main
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          extra-args: --issue ${{ github.event.issue.number }}
