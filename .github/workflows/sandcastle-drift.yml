name: "Sandcastle: Drift"

on:
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        # Pass AGENT_PAT as the checkout token so the persisted git credential
        # (used by `git push` later in this job) can write. The default
        # GITHUB_TOKEN is contents: read here and cannot push branches.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Compare pinned SHA vs hub latest
        id: drift
        run: |
          set -euo pipefail
          pinned=$(jq -r '.lastPinnedSha' .sandcastle/hub-version.json 2>/dev/null || echo "unknown")
          latest=$(gh api repos/arndvs/ctrlshft-hub/commits/main --jq '.sha' | cut -c1-7)
          echo "pinned=$pinned"
          echo "latest=$latest"
          if [ "$pinned" != "$latest" ]; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            echo "latest_sha=$latest" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open review PR on drift
        if: steps.drift.outputs.drifted == 'true'
        env:
          LATEST_SHA: ${{ steps.drift.outputs.latest_sha }}
        run: |
          set -euo pipefail
          branch="sandcastle/hub-review-$(date +%Y%m%d)"
          git config user.name "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"
          # Branch from the default branch explicitly. The workflow-drift step
          # (when present in a consumer copy) may have left the working tree on
          # a dirty sync-workflows branch; branching from HEAD would inherit
          # its unmerged workflow-file changes and fail the push with a
          # workflow-scope rejection.
          git checkout -b "$branch" main
          # detectedAt = when the bot detected the drift (branch creation).
          # reviewedAt is intentionally NOT written here — it is derived from
          # the merge-commit date of this PR by scan-consumers.sh, so it can
          # never claim a human signed off before the merge happened.
          jq --arg sha "$LATEST_SHA" --arg now "$(date +%Y-%m-%d)" \
            '.lastPinnedSha = $sha | .detectedAt = $now' \
            .sandcastle/hub-version.json > tmp.json && mv tmp.json .sandcastle/hub-version.json
          git add .sandcastle/hub-version.json
          git commit -m "chore(sandcastle): pin hub to $LATEST_SHA"
          # Tolerate push failures (e.g. PAT without workflow scope) so a
          # scope issue degrades to a warning, not a red job.
          git push origin "$branch" || true
          gh pr create -R ${{ github.repository }} \
            --base main \
            --head "$branch" \
            --title "chore(sandcastle): review hub SHA update to $LATEST_SHA" \
            --body "The hub engine updated on main. This PR reviews the new SHA before pinning." || true
