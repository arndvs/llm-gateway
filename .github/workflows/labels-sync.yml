name: "Labels: Sync"

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fetch labels from hub
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/arndvs/ctrlshft-hub/contents/templates/labels.json?ref=main" \
            > "$RUNNER_TEMP/labels.json"

      - name: Reconcile labels
        run: |
          set -euo pipefail
          labels_file="$RUNNER_TEMP/labels.json"
          if [ ! -s "$labels_file" ]; then
            echo "No labels fetched from hub — nothing to sync."
            exit 0
          fi
          rows="$(jq -c '.[]' "$labels_file")" || {
            echo "Invalid JSON in $labels_file — aborting." >&2
            exit 1
          }
          failed=0
          while read -r row; do
            [ -n "$row" ] || continue
            name=$(jq -er '.name // error("missing required label key: name")' <<<"$row")
            color=$(jq -er '.color // error("missing required label key: color")' <<<"$row")
            desc=$(jq -er '.description // error("missing required label key: description")' <<<"$row")
            if gh label create "$name" --color "$color" --description "$desc" >/dev/null 2>&1; then
              echo "created: $name"
            elif gh label edit "$name" --color "$color" --description "$desc" >/dev/null 2>&1; then
              echo "synced:  $name"
            else
              echo "FAILED:  $name (create and edit both failed)"
              failed=1
            fi
          done <<<"$rows"
          if [ "$failed" -ne 0 ]; then
            echo "One or more labels could not be reconciled." >&2
            exit 1
          fi
