name: "Agent: Check Stale PRs"

on:
  schedule:
    - cron: "17 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: agent-check-stale-prs
      cancel-in-progress: false
    env:
      ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
    steps:
      - uses: arndvs/ctrlshft-hub/actions/agent-run@main
        with:
          workflow: check-stale-prs
          ref: main
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
