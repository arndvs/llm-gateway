name: "Agent: Update Branch"

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  refuse-fork:
    if: github.event.label.name == 'agent:update-branch' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - name: Block unsafe fork execution
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:update-branch" -R ${{ github.repository }} || true
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" -R ${{ github.repository }} || true
          gh pr comment "$PR_NUMBER" -R ${{ github.repository }} --body "Refused to run \`agent:update-branch\`: this workflow uses \`pull_request_target\` and cannot safely execute agent code for fork PRs."

  update-branch:
    if: github.event.label.name == 'agent:update-branch' && github.event.pull_request.head.repo.full_name == github.repository
    uses: arndvs/ctrlshft-hub/.github/workflows/reusable-update-branch.yml@main
    with:
      pr-number: ${{ github.event.pull_request.number }}
      branch: ${{ github.event.pull_request.head.ref }}
      base-ref: ${{ github.event.pull_request.base.ref }}
      base-branch: ${{ github.event.pull_request.base.ref }}
    secrets: inherit
