name: "Agent: Repo Hygiene"

on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no issue creation)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: agent-repo-hygiene
      cancel-in-progress: false
    env:
      ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
    steps:
      - uses: arndvs/ctrlshft-hub/actions/agent-run@main
        with:
          workflow: repo-hygiene
          ref: main
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          extra-args: $([ "${{ github.event.inputs.dry_run }}" = "true" ] && echo --dry-run)
