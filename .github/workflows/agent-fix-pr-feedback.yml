name: "Agent: Fix PR Feedback"

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refuse-fork:
    if: github.event.label.name == 'agent:fix' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Refuse unsafe fork
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:fix" -R ${{ github.repository }} || true
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" -R ${{ github.repository }} || true
          gh pr comment "$PR_NUMBER" -R ${{ github.repository }} --body "Refused to run \`agent:fix\`: this workflow uses \`pull_request_target\` and cannot safely execute agent code for fork PRs."

  fix-pr-feedback:
    if: github.event.label.name == 'agent:fix' && github.event.pull_request.head.repo.full_name == github.repository
    uses: arndvs/ctrlshft-hub/.github/workflows/reusable-fix-pr-feedback.yml@main
    with:
      pr-number: ${{ github.event.pull_request.number }}
    secrets: inherit
